# =========================================================
# Automatic Water Quality Monitoring System - Configuration
# =========================================================

# Server Port (Dynamic for Cloud/Render deployment, defaults to 8080 locally)
server.port=${PORT:8080}

# Application name
spring.application.name=water-quality-monitoring-system

# Active profile:
# Use 'mysql' to connect to local MySQL (default)
# Use 'h2' to run zero-setup in-memory database without MySQL installed
# Can also be set via CLI: --spring.profiles.active=h2
spring.profiles.active=mysql

# ---------------------------------------------------------
# MySQL Datasource (active when profile is 'mysql' or default)
# Update username/password to match your local MySQL setup.
# ---------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/water_quality_db?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------------------------------------------------------
# JPA / Hibernate
# ---------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ---------------------------------------------------------
# Jackson (JSON) - format dates nicely
# ---------------------------------------------------------
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC

# ---------------------------------------------------------
# Logging
# ---------------------------------------------------------
logging.level.root=INFO
logging.level.com.wqms.watermonitor=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ---------------------------------------------------------
# Static resources
# ---------------------------------------------------------
spring.web.resources.static-locations=classpath:/static/

# ---------------------------------------------------------
# Sample Data Seeder
# When true, automatically inserts initial sample readings if DB is empty
# ---------------------------------------------------------
app.data-loader.enabled=true
